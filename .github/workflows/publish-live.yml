name: Publish live site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Publish live branch
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -a dist/public/. "$publish_dir/"
          cp scripts/live/serve.js "$publish_dir/serve.js"
          cp scripts/live/README-LIVE.md "$publish_dir/README-LIVE.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin live; then
            git checkout -B live FETCH_HEAD
          else
            git checkout --orphan live
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$publish_dir"/. .

          if [ ! -f index.html ] || [ ! -f serve.js ] || [ ! -f README-LIVE.md ] || [ ! -f _redirects ]; then
            echo "Publish folder is missing index.html, serve.js, README-LIVE.md, or _redirects"
            exit 1
          fi
          if [ -f package.json ] || [ -d client ] || [ -d server ]; then
            echo "Refusing to publish source files on the live branch"
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Live branch already matches this build."
            exit 0
          fi

          git commit -m "Publish static site from ${GITHUB_SHA}"
          git push origin live
